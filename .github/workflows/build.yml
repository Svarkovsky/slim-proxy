name: build

# Run: Actions tab -> build -> Run workflow (or any push to main)
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [mips, mipsle, armv7, arm64, amd64]
        variant: [wg, lowmem]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: false
      - run: ./build.sh ${{ matrix.variant }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh source
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release v1.14.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release view v1.14.2 >/dev/null 2>&1 || \
            gh release create v1.14.2 --title "v1.14.2" --notes "Unofficial slim static binaries built from the sing-box v1.14.2 source. Not affiliated with the sing-box authors. See README for variants, architectures and the disclaimer."
          gh release upload v1.14.2 dist/* --clobber
